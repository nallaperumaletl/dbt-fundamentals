version: 2

models:

  - name: bronze_product
    config:
      materialized: view
    columns:  # Data Test
     - name: product_code
       data_tests:
        - unique
        - not_null

  - name: bronze_store
    columns:
      - name: country
        data_tests:
          - accepted_values:
              arguments:
                values: ['USA', 'Canada']

      - name: city
        data_tests:
          - accepted_values:
              arguments:
                values: ['New york', 'Austin', 'Brooklyn', 'San Jose', 'Toronto']
              config:
                severity: warn
          - unique
          - not_null

  - name: bronze_sales
    columns:
      - name: gross_amount
        data_tests:
          - generic_non_negative:
              config:
                store_failures: true
                    


